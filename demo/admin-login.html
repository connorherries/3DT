<!DOCTYPE html>
<!-- Admin login screen for the demo, no backend behind it. -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin Login | Basket Metrics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="demo.css">
</head>
<body data-page="admin-login">
	<header id="site-header"></header>
	<main class="container py-5">
		<form id="demo-form" class="form-panel mx-auto">
			<p class="eyebrow">ADMIN ACCESS</p>
			<h1>Administrator login</h1>
			<label class="form-label" for="email">Email</label>
			<input class="form-control mb-3" id="email" type="email" maxlength="128" placeholder="you@example.com" autocomplete="username" required>
			<label class="form-label" for="password">Password</label>
			<input class="form-control mb-3" id="password" type="password" maxlength="64" autocomplete="current-password" required>
			<button class="btn btn-success w-100" type="submit">Log in</button>
			<p id="form-message" class="mt-3 mb-0" aria-live="polite"></p>
			<a href="admin-signup.html" class="d-inline-block mt-3">Create an admin account</a>
		</form>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="site.js"></script><script src="demo.js"></script>
</body>
</html>
