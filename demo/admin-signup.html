<!DOCTYPE html>
<!--
  This page gives the admin sign-up form used in the assessment demo.
  It includes a name field plus email and password inputs so the site looks complete.
  Like the other account pages, it is intentionally a front-end demo and does not connect to a real database.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin Sign Up | Basket Metrics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="demo.css">
</head>
<body data-page="admin-signup">
	<header id="site-header"></header>
	<main class="container py-5">
		<form id="demo-form" class="form-panel mx-auto">
			<p class="eyebrow">ADMIN ACCESS</p>
			<h1>Create admin account</h1>
			<label class="form-label" for="name">Name</label>
			<input class="form-control mb-3" id="name" type="text" required>
			<label class="form-label" for="email">Email</label>
			<input class="form-control mb-3" id="email" type="email" placeholder="you@example.com" required>
			<label class="form-label" for="password">Password</label>
			<input class="form-control mb-3" id="password" type="password" required>
			<button class="btn btn-success w-100" type="submit">Create account</button>
			<p id="form-message" class="mt-3 mb-0" aria-live="polite"></p>
			<a href="admin-login.html" class="d-inline-block mt-3">Back to admin login</a>
		</form>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="site.js"></script><script src="demo.js"></script>
</body>
</html>
