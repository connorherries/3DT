<!DOCTYPE html>
<!--
  This page is used for side-by-side player comparison.
  It gives the user two dropdown menus and then visually compares stats such as points,
  rebounds, assists, and shooting percentage. It links directly to the same player data used
  elsewhere in the website, making the comparison easy to understand.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Compare Players | Basket Metrics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="demo.css">
</head>
<body data-page="compare">
	<header id="site-header"></header>
	<main class="container py-5">
		<p class="eyebrow">SIDE-BY-SIDE ANALYSIS</p>
		<h1>Compare Players</h1>
		<p class="text-secondary">Choose two players to compare their season averages.</p>
		<div class="row align-items-end g-3 my-4">
			<div class="col-md-5"><label for="compare-first" class="form-label">Player one</label><select id="compare-first" class="form-select"></select></div>
			<div class="col-md-2 text-center"><strong>VS</strong></div>
			<div class="col-md-5"><label for="compare-second" class="form-label">Player two</label><select id="compare-second" class="form-select"></select></div>
		</div>
		<div id="comparison-results"></div>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="site.js"></script><script src="demo.js"></script>
</body>
</html>
