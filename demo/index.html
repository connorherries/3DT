<!DOCTYPE html>
<!--
  This is the landing page for the project.
  It introduces the idea of the app, shows a quick summary of the strongest players,
  and links into the rest of the site: the player directory, comparison tool, learning section,
  and quiz. Its content is filled by demo.js using the generated data files.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Basket Metrics | Home</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="demo.css">
</head>
<body data-page="home">
	<header id="site-header"></header>
	<main class="container py-5">
		<section class="home-hero p-4 p-lg-5 mb-5">
			<div class="row align-items-center g-4">
				<div class="col-lg-8">
					<p class="eyebrow">NBA PLAYER DATA · DATA LEARNING HUB</p>
					<h1 class="display-3 home-title">Learn basketball through the data.</h1>
					<p class="lead">Explore player stats, compare performances, and build a clearer picture of how the game works.</p>
					<a class="btn btn-success" href="players.html">Explore players</a>
					<a class="btn btn-outline-success ms-2" href="quiz.html">Try the quiz</a>
				</div>
				<div class="col-lg-4">
					<div class="impact-box p-4">
						<p class="eyebrow">TOP IMPACT SCORE</p>
						<strong id="top-impact">--</strong>
						<p id="top-player-name" class="mb-0">Loading player...</p>
					</div>
				</div>
			</div>
		</section>

		<section>
			<div class="d-flex flex-wrap justify-content-between align-items-end mb-3">
				<div>
					<p class="eyebrow">QUICK LOOK</p>
					<h2>Top performers by impact</h2>
				</div>
				<a href="players.html">View all players</a>
			</div>
			<div id="leader-list" class="list-group"></div>
		</section>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="site.js"></script>
	<script src="demo.js"></script>
</body>
</html>
