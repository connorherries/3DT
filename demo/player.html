<!DOCTYPE html>
<!--
  This page is a detailed profile page for one selected player.
  It is reached from the player directory and reads the id from the URL, then the JavaScript
  fills in the page with that player's stats and summary information. It is one of the key pages
  in the project because it turns a simple list of numbers into a more personal learning experience.
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Player Profile | Basket Metrics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="demo.css">
</head>
<body data-page="player">
	<header id="site-header"></header>
	<main class="container py-5">
		<a href="players.html" class="btn btn-outline-success mb-4">Back to players</a>
		<div id="player-detail"></div>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="site.js"></script><script src="demo.js"></script>
</body>
</html>
