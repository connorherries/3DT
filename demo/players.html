<!DOCTYPE html>
<!-- Search, filter or sort the generated roster. Find a player quick. -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Players | Basket Metrics</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="demo.css">
</head>
<body data-page="players">
	<header id="site-header"></header>
	<main class="container py-5">
		<p class="eyebrow">PLAYER DIRECTORY</p>
		<div class="d-flex flex-wrap justify-content-between align-items-end mb-4">
			<div>
				<h1>Player Explorer</h1>
				<p class="text-secondary mb-0">Search players and compare their stats.</p>
			</div>
			<p id="player-count" class="text-secondary mb-0"></p>
		</div>
		<div class="row g-3 mb-4">
			<div class="col-md-5"><input id="player-search" class="form-control" type="search" placeholder="Search for a player"></div>
			<div class="col-md-3">
				<select id="position-filter" class="form-select">
					<option value="ALL">All positions</option>
					<option>PG</option><option>SG</option><option>SF</option><option>PF</option><option>C</option>
				</select>
			</div>
			<div class="col-md-4">
				<select id="player-sort" class="form-select">
					<option value="featured">Sort: featured order</option>
					<option value="impact">Sort: impact</option>
					<option value="points">Sort: points</option>
					<option value="rebounds">Sort: rebounds</option>
					<option value="assists">Sort: assists</option>
					<option value="three">Sort: three-point %</option>
					<option value="minutes">Sort: minutes</option>
				</select>
			</div>
		</div>
		<div id="player-list" class="row g-3"></div>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="site.js"></script><script src="demo.js"></script>
</body>
</html>
